name: build-gui-ipa

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: gui-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Show toolchain
        run: |
          node -v
          npm -v
          xcodebuild -version
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Version consistency
        run: node scripts/version.mjs --check
      - name: Run node tests
        run: npm test
      - name: Pack runtime
        run: npm run runtime:pack
      - name: Build web app
        run: npm run build
      - name: Build GUI shell app
        env:
          DSH_REMOTE_GUI_URL: 'http://8.148.10.101/'
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/DSHPocket.xcodeproj \
            -scheme DSHPocket \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build-gui \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DSH_REMOTE_GUI_URL="$DSH_REMOTE_GUI_URL" \
            PRODUCT_BUNDLE_IDENTIFIER=ai.dsh.pocket.gui \
            APP_DISPLAY_NAME="DSH" \
            build
      - name: Validate app bundle
        run: |
          set -euo pipefail
          APP=build-gui/Build/Products/Release-iphoneos/DSHPocket.app
          test -f "$APP/Web/index.html"
          echo "display=$(plutil -extract CFBundleDisplayName raw "$APP/Info.plist")"
          echo "url=$(plutil -extract DSHRemoteGUIURL raw "$APP/Info.plist")"
          echo "version=$(plutil -extract CFBundleShortVersionString raw "$APP/Info.plist")"
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          rm -rf Payload && mkdir Payload
          cp -R build-gui/Build/Products/Release-iphoneos/DSHPocket.app Payload/
          zip -qry "DSHPocket-official-$VERSION.ipa" Payload
          shasum -a 256 "DSHPocket-official-$VERSION.ipa" | tee "DSHPocket-official-$VERSION.ipa.sha256"
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: DSHPocket-official-ipa
          path: |
            DSHPocket-official-*.ipa
            DSHPocket-official-*.ipa.sha256
          retention-days: 14
          if-no-files-found: error
